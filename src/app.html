<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f0f10" />
		<meta
			name="description"
			content="Home workout tracker with 100+ built-in exercises. Track sessions, sets, and reps; everything is saved locally in your browser and works offline."
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Grip" />
		<meta name="application-name" content="Grip" />
		<title>Grip</title>
		<style>
			.boot-splash {
				position: fixed;
				inset: 0;
				z-index: 1000;
				background: #0f0f10;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				transition: opacity 0.35s ease;
				font-family: 'Archivo Black', system-ui, sans-serif;
			}
			.boot-splash.hide {
				opacity: 0;
				pointer-events: none;
			}
			.boot-mark {
				width: 68px;
				height: 68px;
			}
			.boot-word {
				font-size: 42px;
				letter-spacing: 3px;
				color: #f4f4f5;
				font-weight: 800;
			}
			.boot-word b {
				color: #c6ff00;
			}
			.boot-tag {
				font-family: 'Inter', system-ui, sans-serif;
				font-size: 11px;
				color: #6b6b72;
				text-transform: uppercase;
				letter-spacing: 1.5px;
				font-weight: 600;
			}
		</style>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="mask-icon" href="/favicon.svg" color="#c6ff00" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-splash" class="boot-splash" aria-hidden="true">
			<svg class="boot-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<rect width="32" height="32" rx="8" fill="none" />
				<path d="M6 13.5v5M8.5 11v10M26 13.5v5M23.5 11v10" stroke="#c6ff00" stroke-width="2.6" stroke-linecap="round" />
				<rect x="10.5" y="12.5" width="11" height="7" rx="2.2" fill="#c6ff00" />
			</svg>
			<div class="boot-word">GR<b>IP</b></div>
			<div class="boot-tag">get a grip on your training</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
